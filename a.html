<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Runner 3D</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff007f;
            --bg-color: #05050a;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            user-select: none;
            -webkit-user-select: none;
        }

        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* UI Overlays */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 10px var(--neon-blue);
            pointer-events: none;
            z-index: 10;
        }

        .hud-stat {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        #lives-container {
            display: flex;
            gap: 5px;
        }

        .life {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        /* Game Over Screen */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        #game-over-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        h1 {
            font-size: 4rem;
            margin: 0 0 10px 0;
            color: transparent;
            -webkit-text-stroke: 2px var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .score-display {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: transparent;
            border: 2px solid var(--neon-blue);
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4), inset 0 0 15px rgba(0, 210, 255, 0.2);
            transition: all 0.2s;
        }

        button:hover, button:active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.8);
        }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            #hud { font-size: 1rem; flex-wrap: wrap; gap: 10px; }
            h1 { font-size: 2.5rem; }
        }
        
        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            pointer-events: none;
        }
    </style>
    
    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- UI Overlay -->
    <div id="hud">
        <div class="hud-stat" id="score-display">Score: 0</div>
        <div class="hud-stat">
            Lives: <span id="lives-container"><span class="life">♥</span><span class="life">♥</span><span class="life">♥</span></span>
        </div>
    </div>
    
    <div id="controls-hint">Desktop: Mouse to Steer, Click/Space to Jump<br>Mobile: Drag to Steer, Tap to Jump</div>

    <!-- Game Over Screen -->
    <div id="game-over-screen">
        <h1>System Failure</h1>
        <div class="score-display" id="final-score">Score: 0</div>
        <div class="score-display" id="high-score">High Score: 0</div>
        <button id="restart-btn">Restart System</button>
    </div>

    <!-- Game Script -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- GLOBAL CONSTANTS ---
        const TRACK_WIDTH = 12;
        const SEGMENT_LENGTH = 50;
        const VISIBLE_SEGMENTS = 6;
        const BASE_SPEED = 30;
        const MAX_LIVES = 3;
        const COLORS = {
            bg: 0x020205,
            player: 0xffffff,
            trackCenter: 0x111111,
            trackEdge: 0x00aaff,
            obstacleDanger: 0xff0044,
            coin: 0xffaa00,
            star: 0xffffff
        };

        // --- UTILITIES ---
        const randomRange = (min, max) => Math.random() * (max - min) + min;

        // --- PARTICLE SYSTEM ---
        class ParticleSystem {
            constructor(scene) {
                this.scene = scene;
                this.particles = [];
                // Simple box geometry for particles
                this.geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            }

            spawn(position, color, count, type = 'burst') {
                const material = new THREE.MeshBasicMaterial({ color: color, transparent: true });
                for (let i = 0; i < count; i++) {
                    const mesh = new THREE.Mesh(this.geometry, material);
                    mesh.position.copy(position);
                    
                    let velocity;
                    if (type === 'burst') {
                        // Explode outwards
                        velocity = new THREE.Vector3(
                            randomRange(-5, 5),
                            randomRange(2, 8),
                            randomRange(-5, 5)
                        );
                    } else if (type === 'trail') {
                        // Drift backwards
                        velocity = new THREE.Vector3(
                            randomRange(-0.5, 0.5),
                            randomRange(0, 1),
                            randomRange(2, 5)
                        );
                        mesh.scale.setScalar(randomRange(0.5, 1.5));
                    }

                    this.scene.add(mesh);
                    this.particles.push({
                        mesh,
                        velocity,
                        life: 1.0,
                        decay: type === 'burst' ? randomRange(1.5, 2.5) : randomRange(2.0, 4.0)
                    });
                }
            }

            update(dt) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.life -= p.decay * dt;

                    if (p.life <= 0) {
                        this.scene.remove(p.mesh);
                        p.mesh.geometry.dispose();
                        p.mesh.material.dispose();
                        this.particles.splice(i, 1);
                    } else {
                        // Apply gravity and movement
                        p.velocity.y -= 15 * dt; 
                        p.mesh.position.addScaledVector(p.velocity, dt);
                        p.mesh.rotation.x += dt * 2;
                        p.mesh.rotation.y += dt * 2;
                        p.mesh.material.opacity = p.life;
                        p.mesh.scale.setScalar(p.life);
                    }
                }
            }
            
            clear() {
                this.particles.forEach(p => {
                    this.scene.remove(p.mesh);
                    p.mesh.material.dispose();
                });
                this.particles = [];
            }
        }

        // --- TRACK GENERATOR ---
        class TrackGenerator {
            constructor(scene) {
                this.scene = scene;
                this.segments = [];
                this.trackGroup = new THREE.Group();
                this.scene.add(this.trackGroup);

                // Reusable materials
                this.floorMat = new THREE.MeshStandardMaterial({ 
                    color: COLORS.trackCenter, 
                    roughness: 0.1, 
                    metalness: 0.8 
                });
                this.edgeMat = new THREE.MeshStandardMaterial({ 
                    color: COLORS.trackEdge, 
                    emissive: COLORS.trackEdge, 
                    emissiveIntensity: 1 
                });

                // Pre-generate segments (Object Pooling)
                for (let i = 0; i < VISIBLE_SEGMENTS; i++) {
                    this.createSegment(-i * SEGMENT_LENGTH);
                }
            }

            createSegment(zPos) {
                const group = new THREE.Group();

                // Main floor
                const floorGeo = new THREE.BoxGeometry(TRACK_WIDTH, 1, SEGMENT_LENGTH);
                const floor = new THREE.Mesh(floorGeo, this.floorMat);
                floor.position.y = -0.5;
                floor.receiveShadow = true;
                group.add(floor);

                // Glowing Edges
                const edgeGeo = new THREE.BoxGeometry(0.5, 1.2, SEGMENT_LENGTH);
                const leftEdge = new THREE.Mesh(edgeGeo, this.edgeMat);
                leftEdge.position.set(-TRACK_WIDTH/2 - 0.25, -0.4, 0);
                
                const rightEdge = new THREE.Mesh(edgeGeo, this.edgeMat);
                rightEdge.position.set(TRACK_WIDTH/2 + 0.25, -0.4, 0);
                
                group.add(leftEdge, rightEdge);
                group.position.z = zPos;

                this.trackGroup.add(group);
                this.segments.push(group);
            }

            update(playerZ) {
                // Find the segment furthest behind the player and move it forward
                this.segments.forEach(segment => {
                    if (segment.position.z > playerZ + SEGMENT_LENGTH) {
                        // Find minimum Z currently in segments
                        const minZ = Math.min(...this.segments.map(s => s.position.z));
                        segment.position.z = minZ - SEGMENT_LENGTH;
                    }
                });
            }
        }

        // --- OBSTACLE & COLLECTIBLE MANAGER ---
        class ObstacleManager {
            constructor(scene, particleSystem) {
                this.scene = scene;
                this.particleSystem = particleSystem;
                this.items = []; // Array to hold active obstacles/coins
                
                // Geometries & Materials
                this.cubeGeo = new THREE.BoxGeometry(2, 2, 2);
                this.pillarGeo = new THREE.CylinderGeometry(1, 1, 6, 8);
                this.coinGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16);
                this.coinGeo.rotateX(Math.PI / 2); // Stand coin up

                this.dangerMat = new THREE.MeshStandardMaterial({
                    color: COLORS.obstacleDanger,
                    emissive: COLORS.obstacleDanger,
                    emissiveIntensity: 0.8,
                    roughness: 0.2, metalness: 0.8
                });
                
                this.coinMat = new THREE.MeshStandardMaterial({
                    color: COLORS.coin,
                    emissive: COLORS.coin,
                    emissiveIntensity: 0.6,
                    metalness: 1.0, roughness: 0.1
                });
                
                this.box3 = new THREE.Box3(); // Reusable for collisions
            }

            spawn(zPos) {
                // Don't spawn too close to start
                if (zPos > -50) return;

                const roll = Math.random();
                
                if (roll < 0.2) {
                    // Spawn a coin
                    this.spawnItem('coin', zPos, randomRange(-TRACK_WIDTH/2 + 1, TRACK_WIDTH/2 - 1), 1);
                } else if (roll < 0.5) {
                    // Static Cube
                    this.spawnItem('static', zPos, randomRange(-TRACK_WIDTH/2 + 1.5, TRACK_WIDTH/2 - 1.5), 1);
                } else if (roll < 0.75) {
                    // Sliding Wall
                    this.spawnItem('slider', zPos, 0, 1);
                } else {
                    // Rotating Pillar
                    this.spawnItem('pillar', zPos, randomRange(-TRACK_WIDTH/2 + 2, TRACK_WIDTH/2 - 2), 3);
                }
            }

            spawnItem(type, z, x, y) {
                let mesh;
                if (type === 'coin') {
                    mesh = new THREE.Mesh(this.coinGeo, this.coinMat);
                } else if (type === 'pillar') {
                    mesh = new THREE.Mesh(this.pillarGeo, this.dangerMat);
                } else {
                    mesh = new THREE.Mesh(this.cubeGeo, this.dangerMat);
                }

                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                this.scene.add(mesh);
                this.items.push({
                    mesh,
                    type,
                    collected: false,
                    speedX: type === 'slider' ? randomRange(5, 10) * (Math.random()>0.5?1:-1) : 0
                });
            }

            update(dt, playerZ) {
                for (let i = this.items.length - 1; i >= 0; i--) {
                    const item = this.items[i];

                    // Animations
                    if (item.type === 'coin') {
                        item.mesh.rotation.y += dt * 3;
                        item.mesh.position.y = 1 + Math.sin(Date.now() * 0.005 + item.mesh.position.z) * 0.3;
                    } else if (item.type === 'pillar') {
                        item.mesh.rotation.x += dt * 2;
                        item.mesh.rotation.z += dt * 2;
                    } else if (item.type === 'slider') {
                        item.mesh.position.x += item.speedX * dt;
                        // Bounce off walls
                        if (item.mesh.position.x > TRACK_WIDTH/2 - 1 || item.mesh.position.x < -TRACK_WIDTH/2 + 1) {
                            item.speedX *= -1;
                        }
                    }

                    // Remove if passed far behind
                    if (item.mesh.position.z > playerZ + 20 || item.collected) {
                        this.scene.remove(item.mesh);
                        this.items.splice(i, 1);
                    }
                }
            }

            checkCollisions(playerBox) {
                let hitObstacle = false;
                let coinsCollected = 0;

                for (let i = 0; i < this.items.length; i++) {
                    const item = this.items[i];
                    if (item.collected) continue;

                    this.box3.setFromObject(item.mesh);

                    if (this.box3.intersectsBox(playerBox)) {
                        if (item.type === 'coin') {
                            item.collected = true;
                            coinsCollected++;
                            this.particleSystem.spawn(item.mesh.position, COLORS.coin, 15, 'burst');
                        } else {
                            hitObstacle = true;
                            // Mark as collected so we don't double-hit
                            item.collected = true;
                            this.particleSystem.spawn(item.mesh.position, COLORS.obstacleDanger, 20, 'burst');
                        }
                    }
                }
                return { hitObstacle, coinsCollected };
            }

            clear() {
                this.items.forEach(item => this.scene.remove(item.mesh));
                this.items = [];
            }
        }

        // --- PLAYER ---
        class Player {
            constructor(scene, particleSystem) {
                this.scene = scene;
                this.particleSystem = particleSystem;
                
                // Chrome sphere
                const geo = new THREE.SphereGeometry(1, 32, 32);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    metalness: 1.0,
                    roughness: 0.1,
                    envMapIntensity: 2.0
                });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.set(0, 1, 0);
                this.mesh.castShadow = true;
                this.scene.add(this.mesh);

                // Physics state
                this.velocity = new THREE.Vector3();
                this.gravity = -50;
                this.jumpForce = 20;
                this.isGrounded = true;
                this.targetX = 0;
                
                // Game State
                this.speed = BASE_SPEED;
                this.invulnerableTimer = 0;
                this.knockbackVel = 0;

                this.box3 = new THREE.Box3();
            }

            setTargetX(xNorm) {
                // xNorm is -1 (left) to 1 (right)
                this.targetX = xNorm * (TRACK_WIDTH / 2 - 1);
            }

            jump() {
                if (this.isGrounded) {
                    this.velocity.y = this.jumpForce;
                    this.isGrounded = false;
                }
            }

            hit() {
                if (this.invulnerableTimer > 0) return false; // Already hit
                this.invulnerableTimer = 2.0; // 2 seconds i-frames
                this.knockbackVel = 20; // Push back effect
                return true;
            }

            update(dt) {
                // Forward movement
                let currentSpeed = this.speed;
                
                // Handle Knockback
                if (this.knockbackVel > 0) {
                    currentSpeed -= this.knockbackVel;
                    this.knockbackVel -= 40 * dt; // recover quickly
                    if (this.knockbackVel < 0) this.knockbackVel = 0;
                }

                this.mesh.position.z -= currentSpeed * dt;

                // Horizontal movement (Smooth interpolation)
                this.mesh.position.x += (this.targetX - this.mesh.position.x) * 10 * dt;

                // Vertical movement (Gravity)
                this.velocity.y += this.gravity * dt;
                this.mesh.position.y += this.velocity.y * dt;

                // Floor collision
                if (this.mesh.position.y <= 1) {
                    this.mesh.position.y = 1;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                }

                // Sphere rolling animation
                this.mesh.rotation.x -= currentSpeed * dt * 0.5;
                this.mesh.rotation.z -= (this.targetX - this.mesh.position.x) * dt * 2;

                // I-frames blinking effect
                if (this.invulnerableTimer > 0) {
                    this.invulnerableTimer -= dt;
                    this.mesh.material.opacity = Math.sin(this.invulnerableTimer * 30) * 0.5 + 0.5;
                    this.mesh.material.transparent = true;
                } else {
                    this.mesh.material.opacity = 1.0;
                    this.mesh.material.transparent = false;
                }

                // Update Bounding Box
                this.box3.setFromObject(this.mesh);

                // Spawn Trail
                if (Math.random() < 0.3 && this.isGrounded) {
                    const trailPos = this.mesh.position.clone();
                    trailPos.y -= 0.8;
                    this.particleSystem.spawn(trailPos, COLORS.trackEdge, 1, 'trail');
                }
            }

            reset() {
                this.mesh.position.set(0, 1, 0);
                this.velocity.set(0,0,0);
                this.speed = BASE_SPEED;
                this.invulnerableTimer = 0;
                this.knockbackVel = 0;
                this.targetX = 0;
            }
        }

        // --- GAME MANAGER ---
        class GameManager {
            constructor() {
                this.initThree();
                this.initGameSystems();
                this.initUI();
                this.initInput();
                
                this.clock = new THREE.Clock();
                this.state = 'playing'; // playing, gameover
                this.score = 0;
                this.lives = MAX_LIVES;
                this.timeElapsed = 0;
                this.lastSpawnZ = 0;
                this.screenShakeTimer = 0;
                
                // Start Loop
                this.animate();
            }

            initThree() {
                // Scene setup
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(COLORS.bg);
                this.scene.fog = new THREE.Fog(COLORS.bg, 20, 100);

                // Camera
                this.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 150);
                this.cameraBaseOffset = new THREE.Vector3(0, 4, 8); // Offset behind player
                
                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // cap for perf
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.body.appendChild(this.renderer.domElement);
                this.renderer.domElement.id = 'game-canvas';

                // Post-Processing (Bloom)
                const renderScene = new RenderPass(this.scene, this.camera);
                const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
                bloomPass.threshold = 0.1;
                bloomPass.strength = 1.2;
                bloomPass.radius = 0.5;

                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(renderScene);
                this.composer.addPass(bloomPass);

                // Lights
                const ambient = new THREE.AmbientLight(0xffffff, 0.3);
                this.scene.add(ambient);
                
                this.dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
                this.dirLight.position.set(10, 20, 10);
                this.dirLight.castShadow = true;
                this.dirLight.shadow.camera.top = 20;
                this.dirLight.shadow.camera.bottom = -20;
                this.dirLight.shadow.camera.left = -20;
                this.dirLight.shadow.camera.right = 20;
                this.scene.add(this.dirLight);

                // Stars Background
                this.createStars();

                window.addEventListener('resize', this.onWindowResize.bind(this));
            }

            createStars() {
                const starGeo = new THREE.BufferGeometry();
                const starCount = 2000;
                const posArray = new Float32Array(starCount * 3);
                for(let i = 0; i < starCount * 3; i++) {
                    posArray[i] = (Math.random() - 0.5) * 400;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                const starMat = new THREE.PointsMaterial({ size: 0.5, color: COLORS.star, transparent: true, opacity: 0.8 });
                this.stars = new THREE.Points(starGeo, starMat);
                this.scene.add(this.stars);
            }

            initGameSystems() {
                this.particleSystem = new ParticleSystem(this.scene);
                this.trackGen = new TrackGenerator(this.scene);
                this.player = new Player(this.scene, this.particleSystem);
                this.obstacleManager = new ObstacleManager(this.scene, this.particleSystem);
            }

            initUI() {
                this.scoreDisplay = document.getElementById('score-display');
                this.livesContainer = document.getElementById('lives-container');
                this.gameOverScreen = document.getElementById('game-over-screen');
                this.finalScoreEl = document.getElementById('final-score');
                this.highScoreEl = document.getElementById('high-score');
                
                document.getElementById('restart-btn').addEventListener('click', () => this.restart());
                
                this.highScore = localStorage.getItem('neonRunnerHighScore') || 0;
            }

            initInput() {
                // Mouse / Touch Position
                const handleMove = (x) => {
                    if (this.state !== 'playing') return;
                    const normalizedX = (x / window.innerWidth) * 2 - 1;
                    this.player.setTargetX(normalizedX);
                };

                window.addEventListener('mousemove', (e) => handleMove(e.clientX));
                window.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX), {passive: false});

                // Jump
                const handleJump = (e) => {
                    // Prevent jump if clicking restart button
                    if (e.target.tagName === 'BUTTON') return;
                    if (this.state === 'playing') this.player.jump();
                };

                window.addEventListener('mousedown', handleJump);
                window.addEventListener('touchstart', handleJump, {passive: false});
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        handleJump(e);
                    }
                });
            }

            updateUI() {
                this.scoreDisplay.innerText = `Score: ${Math.floor(this.score)}`;
                
                // Update Lives
                let livesHtml = '';
                for(let i=0; i<this.lives; i++) livesHtml += '<span class="life">♥</span>';
                this.livesContainer.innerHTML = livesHtml;
            }

            triggerScreenShake(duration) {
                this.screenShakeTimer = duration;
            }

            gameOver() {
                this.state = 'gameover';
                
                // Save High Score
                if (this.score > this.highScore) {
                    this.highScore = Math.floor(this.score);
                    localStorage.setItem('neonRunnerHighScore', this.highScore);
                }

                this.finalScoreEl.innerText = `Score: ${Math.floor(this.score)}`;
                this.highScoreEl.innerText = `High Score: ${this.highScore}`;
                this.gameOverScreen.classList.add('visible');
            }

            restart() {
                this.state = 'playing';
                this.score = 0;
                this.lives = MAX_LIVES;
                this.timeElapsed = 0;
                this.lastSpawnZ = 0;
                
                this.player.reset();
                this.obstacleManager.clear();
                this.particleSystem.clear();
                
                this.gameOverScreen.classList.remove('visible');
                this.updateUI();
            }

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                
                const dt = Math.min(this.clock.getDelta(), 0.1); // Cap delta time

                if (this.state === 'playing') {
                    // Update Time & Progression
                    this.timeElapsed += dt;
                    
                    // Increase speed every 10 seconds
                    this.player.speed = BASE_SPEED + Math.floor(this.timeElapsed / 10) * 5;
                    // Passive score
                    this.score += dt * (this.player.speed / 10);

                    // Update Entities
                    this.player.update(dt);
                    this.trackGen.update(this.player.mesh.position.z);
                    this.obstacleManager.update(dt, this.player.mesh.position.z);
                    this.particleSystem.update(dt);

                    // Spawn Obstacles periodically ahead of the player
                    const spawnDistance = 80; // Distance ahead to spawn
                    const currentZ = this.player.mesh.position.z;
                    if (currentZ - spawnDistance < this.lastSpawnZ) {
                        this.obstacleManager.spawn(this.lastSpawnZ);
                        // Spawn rate increases with speed
                        const spawnInterval = Math.max(10, 40 - (this.player.speed - BASE_SPEED));
                        this.lastSpawnZ -= spawnInterval; 
                    }

                    // Collisions
                    const colResult = this.obstacleManager.checkCollisions(this.player.box3);
                    if (colResult.coinsCollected > 0) {
                        this.score += 100 * colResult.coinsCollected;
                    }
                    if (colResult.hitObstacle) {
                        if (this.player.hit()) {
                            this.lives--;
                            this.triggerScreenShake(0.3);
                            this.updateUI();
                            if (this.lives <= 0) {
                                this.gameOver();
                            }
                        }
                    }

                    this.updateUI();
                }

                // Camera follow logic
                const idealCamPos = this.player.mesh.position.clone().add(this.cameraBaseOffset);
                this.camera.position.lerp(idealCamPos, 0.1);
                
                // Make camera look slightly ahead of the player
                const lookTarget = this.player.mesh.position.clone();
                lookTarget.z -= 15;
                this.camera.lookAt(lookTarget);

                // Apply Screen Shake
                if (this.screenShakeTimer > 0) {
                    this.screenShakeTimer -= dt;
                    const shakeAmount = this.screenShakeTimer * 2;
                    this.camera.position.x += randomRange(-shakeAmount, shakeAmount);
                    this.camera.position.y += randomRange(-shakeAmount, shakeAmount);
                }

                // Move Stars slightly
                if(this.stars) {
                    this.stars.position.z = this.player.mesh.position.z;
                    this.stars.rotation.y += dt * 0.05;
                }

                // Keep directional light with player
                this.dirLight.position.z = this.player.mesh.position.z + 10;
                this.dirLight.target = this.player.mesh;

                // Render via Composer (Bloom)
                this.composer.render();
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.composer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // Initialize game when DOM is ready
        window.onload = () => {
            const game = new GameManager();
        };

    </script>
</body>
